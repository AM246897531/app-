name: Build APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify no INTERNET permission
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          ! grep -q "android.permission.INTERNET" permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-handwriting-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
